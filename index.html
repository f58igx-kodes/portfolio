<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title id="pageTitle">PORTFOLIO.EXE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --desktop-teal: #018281;
            --face: #c3c3c3;
            --face-light: #dcdcdc;
            --hi: #ffffff;
            --sh: #808080;
            --sh-dark: #0a0a0a;
            --title-a: #000878;
            --title-b: #1084d0;
            --title-inactive: #7b7b7b;
            --select-blue: #000878;
            --black: #000000;
            --crt-green: #00ff41;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: none;
            font-smooth: never;
            text-rendering: optimizeSpeed;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--desktop-teal);
            background-image:
                linear-gradient(45deg, rgba(255, 255, 255, .05) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, .05) 75%),
                linear-gradient(45deg, rgba(255, 255, 255, .05) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, .05) 75%);
            background-size: 8px 8px;
            background-position: 0 0, 4px 4px;
            font-family: 'VT323', monospace;
            image-rendering: pixelated;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><polygon points="2,1 2,16 6,12 9,18 11,17 8,11 13,11" fill="white" stroke="black" stroke-width="1"/></svg>') 2 1, auto;
        }

        body.wait-cursor,
        body.wait-cursor * {
            cursor: wait !important;
        }

        #root {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* ---------- BOOT SCREEN ---------- */
        #boot {
            position: fixed;
            inset: 0;
            background: #000;
            color: #c3c3c3;
            font-family: 'VT323', monospace;
            font-size: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 20px;
            letter-spacing: 1px;
        }

        #boot .bios {
            align-self: flex-start;
            padding: 24px;
            white-space: pre;
            font-size: 16px;
            line-height: 1.5;
            color: #b6b6b6;
            position: absolute;
            top: 0;
            left: 0;
            margin: 0;
        }
        
        #boot .boot-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        #boot .blink {
            animation: blink 1s steps(1) infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        #logoBuild {
            display: grid;
            grid-template-columns: repeat(4, 26px);
            grid-template-rows: repeat(4, 26px);
            gap: 4px;
            margin: 0;
        }

        #logoBuild div {
            width: 26px;
            height: 26px;
            opacity: 0;
            transform: scale(.2);
            transition: all .35s ease;
        }

        #logoBuild div.show {
            opacity: 1;
            transform: scale(1);
        }

        .c1 {
            background: #ff3d3d;
        }

        .c2 {
            background: #3dff5d;
        }

        .c3 {
            background: #3d7bff;
        }

        .c4 {
            background: #ffd23d;
        }

        #bootCaption {
            margin: 0;
            font-size: 22px;
            letter-spacing: 3px;
        }

        #progressWrap {
            width: 280px;
            height: 18px;
            border: 2px solid #c3c3c3;
            margin: 0;
            padding: 2px;
        }

        #progressBar {
            height: 100%;
            width: 0%;
            background: repeating-linear-gradient(90deg, var(--select-blue) 0 8px, transparent 8px 12px);
            transition: width 2.4s linear;
        }

        /* ---------- DESKTOP ---------- */
        #desktop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 50px;
            padding: 14px;
            padding-left: 60px;
            padding-right: 60px;
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(5, 92px);
            gap: 3px 50px;
            justify-content: start;
            align-content: start;
            overflow-y: auto;
            overflow-x: auto;
        }


        .icon {
            width: 84px;
            height: 84px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 2px;
            cursor: pointer;
            user-select: none;
        }

        .icon:focus,
        .icon.selected {
            outline: 1px dotted #fff;
            background: rgba(0, 8, 120, 0.35);
        }

        .icon svg {
            width: 38px;
            height: 38px;
            image-rendering: pixelated;
        }

        .icon span {
            color: #fff;
            font-family: 'Silkscreen', monospace;
            font-size: 12px;
            text-align: center;
            text-shadow: 1px 1px 0 #000;
            line-height: 1.25;
            padding: 0 2px;
        }

        .icon.selected span {
            background: var(--select-blue);
        }

        /* ---------- WINDOWS ---------- */
        .win {
            position: absolute;
            min-width: 280px;
            max-width: calc(100vw - 20px);
            max-height: calc(100vh - 50px);
            background: var(--face);
            border: 2px solid;
            border-color: var(--hi) var(--sh-dark) var(--sh-dark) var(--hi);
            box-shadow: 1px 1px 0 #000, 3px 3px 8px rgba(0, 0, 0, .5);
            display: flex;
            flex-direction: column;
        }

        .win.inactive .titlebar {
            background: var(--title-inactive) !important;
        }

        .titlebar {
            height: 26px;
            background: linear-gradient(90deg, var(--title-a), var(--title-b));
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3px 0 4px;
            cursor: default;
            flex-shrink: 0;
        }

        .titlebar .tleft {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
        }

        .titlebar .ticon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .titlebar span.ttext {
            color: #fff;
            font-family: 'Silkscreen', monospace;
            font-size: 12px;
            letter-spacing: .5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tbtns {
            display: flex;
            gap: 2px;
        }

        .tbtn {
            width: 18px;
            height: 16px;
            background: var(--face);
            border: 1px solid;
            border-color: var(--hi) var(--sh-dark) var(--sh-dark) var(--hi);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-family: monospace;
            color: #000;
            line-height: 1;
            cursor: pointer;
            font-weight: bold;
        }

        .tbtn:active {
            border-color: var(--sh-dark) var(--hi) var(--hi) var(--sh-dark);
        }

        .menubar {
            height: 22px;
            background: var(--face);
            border-bottom: 1px solid var(--sh);
            display: flex;
            align-items: center;
            padding: 0 6px;
            gap: 14px;
            flex-shrink: 0;
        }

        .menubar span {
            font-family: 'Silkscreen', monospace;
            font-size: 11px;
            color: #000;
        }

        .win-body {
            flex: 1;
            overflow: auto;
            background: #fff;
            padding: 14px;
            border: 1px solid;
            border-color: var(--sh) var(--hi) var(--hi) var(--sh);
            margin: 2px;
            font-family: 'VT323', monospace;
            font-size: 19px;
            color: #111;
            line-height: 1.35;
        }

        .win-body.explorer {
            background: #fff;
            padding: 10px;
        }

        .win-body::-webkit-scrollbar {
            width: 16px;
            height: 16px;
        }

        .win-body::-webkit-scrollbar-track {
            background: var(--face);
            border-left: 1px solid var(--sh);
        }

        .win-body::-webkit-scrollbar-thumb {
            background: var(--face);
            border: 1px solid;
            border-color: var(--hi) var(--sh-dark) var(--sh-dark) var(--hi);
        }

        .win-body::-webkit-scrollbar-button {
            background: var(--face);
            height: 16px;
            border: 1px solid;
            border-color: var(--hi) var(--sh-dark) var(--sh-dark) var(--hi);
        }

        /* ---------- TOOLTIPS ---------- */
        .icon {
            position: relative;
        }

        .icon[data-tip]:hover::after {
            content: attr(data-tip);
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 4px;
            background: #ffffe1;
            color: #000;
            border: 1px solid #000;
            font-family: 'VT323', monospace;
            font-size: 13px;
            padding: 2px 6px;
            white-space: nowrap;
            z-index: 6000;
            pointer-events: none;
        }

        /* ---------- CONTEXT MENU ---------- */
        .ctx-menu {
            position: fixed;
            min-width: 170px;
            background: var(--face);
            border: 2px solid;
            border-color: var(--hi) var(--sh-dark) var(--sh-dark) var(--hi);
            box-shadow: 2px 2px 6px rgba(0, 0, 0, .5);
            z-index: 9500;
            padding: 2px 0;
        }

        .ctx-item {
            padding: 6px 14px;
            font-family: 'VT323', monospace;
            font-size: 16px;
            color: #000;
            cursor: pointer;
        }

        .ctx-item:hover {
            background: var(--select-blue);
            color: #fff;
        }

        .ctx-item.disabled {
            color: #999;
            cursor: default;
        }

        .ctx-item.disabled:hover {
            background: none;
        }

        .ctx-sep {
            height: 1px;
            background: var(--sh);
            border-bottom: 1px solid var(--hi);
            margin: 3px 4px;
        }

        .win-statusbar {
            height: 20px;
            background: var(--face);
            border-top: 1px solid var(--hi);
            display: flex;
            align-items: center;
            padding: 0 8px;
            font-family: 'VT323', monospace;
            font-size: 14px;
            flex-shrink: 0;
        }

        .win-statusbar .cell {
            border: 1px solid;
            border-color: var(--sh) var(--hi) var(--hi) var(--sh);
            padding: 0 6px;
            margin-right: 6px;
        }

        h2.doc-title {
            font-family: 'Silkscreen', monospace;
            font-size: 16px;
            margin: 0 0 12px 0;
            color: #000878;
        }

        .divider {
            border: none;
            border-top: 1px solid #999;
            margin: 10px 0;
        }

        .proj-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 14px;
        }

        .proj-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 8px;
            text-align: center;
        }

        .proj-item:hover {
            background: #d6e4ff;
        }

        .proj-thumb {
            width: 64px;
            height: 64px;
            border: 2px solid;
            border-color: var(--sh) var(--hi) var(--hi) var(--sh);
            image-rendering: pixelated;
        }

        .proj-item span {
            font-family: 'Silkscreen', monospace;
            font-size: 11px;
        }

        .field {
            margin-bottom: 10px;
        }

        .field label {
            font-family: 'Silkscreen', monospace;
            font-size: 11px;
            display: block;
            margin-bottom: 4px;
        }

        .field input,
        .field textarea {
            width: 100%;
            font-family: 'VT323', monospace;
            font-size: 17px;
            padding: 5px;
            border: 2px solid;
            border-color: var(--sh) var(--hi) var(--hi) var(--sh);
            background: #fff;
        }

        .btn95 {
            font-family: 'Silkscreen', monospace;
            font-size: 11px;
            background: var(--face);
            padding: 8px 16px;
            border: 2px solid;
            border-color: var(--hi) var(--sh-dark) var(--sh-dark) var(--hi);
            cursor: pointer;
        }

        .btn95:active {
            border-color: var(--sh-dark) var(--hi) var(--hi) var(--sh-dark);
        }

        /* ---------- MINESWEEPER ---------- */
        .ms-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .ms-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--face);
            padding: 6px;
            margin-bottom: 6px;
            border: 2px solid;
            border-color: var(--sh) var(--hi) var(--hi) var(--sh);
        }

        .ms-counter {
            background: #000;
            color: #ff2b2b;
            font-family: 'VT323', monospace;
            font-size: 22px;
            letter-spacing: 2px;
            padding: 1px 6px;
            border: 2px solid;
            border-color: var(--sh-dark) var(--hi) var(--hi) var(--sh-dark);
            min-width: 44px;
            text-align: center;
        }

        .ms-face {
            width: 32px;
            height: 32px;
            background: var(--face);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid;
            border-color: var(--hi) var(--sh-dark) var(--sh-dark) var(--hi);
        }

        .ms-face:active {
            border-color: var(--sh-dark) var(--hi) var(--hi) var(--sh-dark);
        }

        .ms-grid {
            display: grid;
            grid-template-columns: repeat(9, 24px);
            grid-template-rows: repeat(9, 24px);
            border: 2px solid;
            border-color: var(--sh-dark) var(--hi) var(--hi) var(--sh-dark);
        }

        .ms-cell {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Silkscreen', monospace;
            font-size: 12px;
            font-weight: 700;
            user-select: none;
            cursor: pointer;
            background: var(--face);
            border: 2px solid;
            border-color: var(--hi) var(--sh) var(--sh) var(--hi);
        }

        .ms-cell:active {
            border-width: 1px;
        }

        .ms-cell.revealed {
            background: #bdbdbd;
            border: 1px solid #8f8f8f;
            cursor: default;
        }

        .ms-cell.mine-hit {
            background: #ff3d3d;
        }

        .ms-cell[data-n="1"] {
            color: #0000ff;
        }

        .ms-cell[data-n="2"] {
            color: #007800;
        }

        .ms-cell[data-n="3"] {
            color: #ff0000;
        }

        .ms-cell[data-n="4"] {
            color: #000078;
        }

        .ms-cell[data-n="5"] {
            color: #780000;
        }

        .ms-cell[data-n="6"] {
            color: #008080;
        }

        .ms-cell[data-n="7"] {
            color: #000;
        }

        .ms-cell[data-n="8"] {
            color: #808080;
        }

        .ms-status {
            margin-top: 8px;
            font-family: 'Silkscreen', monospace;
            font-size: 11px;
            color: #555;
            text-align: center;
        }

        /* ---------- PAINT ---------- */
        .paint-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
        }

        .paint-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .paint-tools {
            display: flex;
            gap: 4px;
        }

        .pt-btn {
            min-width: 30px;
            height: 28px;
            padding: 0 6px;
            background: var(--face);
            border: 2px solid;
            border-color: var(--hi) var(--sh-dark) var(--sh-dark) var(--hi);
            font-size: 13px;
            font-family: 'Silkscreen', monospace;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pt-btn.active {
            border-color: var(--sh-dark) var(--hi) var(--hi) var(--sh-dark);
            background: #d6d6d6;
        }

        .paint-palette {
            display: grid;
            grid-template-columns: repeat(10, 18px);
            grid-auto-rows: 18px;
            gap: 2px;
            background: var(--face);
            padding: 4px;
            border: 2px solid;
            border-color: var(--sh) var(--hi) var(--hi) var(--sh);
        }

        .paint-swatch {
            width: 18px;
            height: 18px;
            border: 1px solid #555;
            cursor: pointer;
        }

        .paint-swatch.selected {
            outline: 2px solid #000878;
            outline-offset: 1px;
        }

        #paintCanvas {
            background: #fff;
            cursor: crosshair;
            image-rendering: pixelated;
            border: 2px solid;
            border-color: var(--sh-dark) var(--hi) var(--hi) var(--sh-dark);
        }

        /* ---------- START MENU ---------- */
        #startMenu {
            position: fixed;
            bottom: 34px;
            left: 2px;
            width: 220px;
            background: var(--face);
            border: 2px solid;
            border-color: var(--hi) var(--sh-dark) var(--sh-dark) var(--hi);
            display: none;
            z-index: 5000;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, .5);
        }

        #startMenu.open {
            display: flex;
        }

        .sm-banner {
            width: 34px;
            background: linear-gradient(180deg, #000878, #1084d0);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
        }

        .sm-banner span {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            color: #fff;
            font-family: 'Silkscreen', monospace;
            font-size: 15px;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .sm-items {
            flex: 1;
            padding: 4px 0;
        }

        .sm-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 10px;
            cursor: pointer;
            font-family: 'Silkscreen', monospace;
            font-size: 12px;
            color: #000;
        }

        .sm-item:hover {
            background: var(--select-blue);
            color: #fff;
        }

        .sm-item svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .sm-sep {
            height: 1px;
            background: var(--sh);
            margin: 4px 6px;
            border-bottom: 1px solid var(--hi);
        }

        /* ---------- TASKBAR ---------- */
        #taskbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 32px;
            background: var(--face);
            border-top: 2px solid var(--hi);
            display: flex;
            align-items: center;
            padding: 2px 4px;
            gap: 4px;
            z-index: 4000;
        }

        #startBtn {
            height: 26px;
            padding: 0 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Silkscreen', monospace;
            font-weight: 700;
            font-size: 13px;
            border: 2px solid;
            border-color: var(--hi) var(--sh-dark) var(--sh-dark) var(--hi);
            cursor: pointer;
        }

        #startBtn.active,
        #startBtn:active {
            border-color: var(--sh-dark) var(--hi) var(--hi) var(--sh-dark);
            background: #d6d6d6;
        }

        #startBtn svg {
            width: 18px;
            height: 18px;
        }

        #taskDivider {
            width: 2px;
            height: 24px;
            border-left: 1px solid var(--sh);
            border-right: 1px solid var(--hi);
            margin: 0 2px;
        }

        #taskApps {
            flex: 1;
            display: flex;
            gap: 4px;
            overflow: hidden;
        }

        .task-btn {
            height: 26px;
            padding: 0 10px;
            max-width: 170px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Silkscreen', monospace;
            font-size: 11px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            border: 2px solid;
            border-color: var(--hi) var(--sh-dark) var(--sh-dark) var(--hi);
            cursor: pointer;
            background: var(--face);
        }

        .task-btn.active {
            border-color: var(--sh-dark) var(--hi) var(--hi) var(--sh-dark);
            background: #b0b0b0;
        }

        .task-btn svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        #clock {
            height: 26px;
            padding: 0 10px;
            display: flex;
            align-items: center;
            border: 2px solid;
            border-color: var(--sh) var(--hi) var(--hi) var(--sh);
            font-family: 'VT323', monospace;
            font-size: 16px;
        }

        #trayWrap {
            height: 26px;
            padding: 0 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid;
            border-color: var(--sh) var(--hi) var(--hi) var(--sh);
            margin-right: 4px;
        }

        #muteBtn {
            cursor: pointer;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #muteBtn svg {
            width: 16px;
            height: 16px;
        }

        /* ---------- RESPONSIVE DESIGN ---------- */
        @media (max-width: 1024px) {
            #desktop {
                grid-auto-flow: row;
                grid-template-rows: auto;
                grid-template-columns: repeat(4, 85px);
                gap: 10px;
                justify-items: start;
                justify-content: start;
            }

            .icon {
                width: 75px;
                height: 75px;
            }

            .icon svg {
                width: 34px;
                height: 34px;
            }

            .icon span {
                font-size: 11px;
            }
        }

        @media (max-width: 768px) {
            #desktop {
                grid-auto-flow: row;
                grid-template-rows: auto;
                grid-template-columns: repeat(3, 80px);
                gap: 8px;
                padding: 10px;
                padding-bottom: 50px;
                justify-items: start;
                justify-content: start;
            }

            .icon {
                width: 70px;
                height: 70px;
                gap: 2px;

        /* ===================== SOUND ENGINE ===================== */
        let audioCtx = null;
        let muted = false;
        function ensureAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function tone(freq, start, dur, type = 'square', vol = 0.06) {
            const ctx = ensureAudio();
            if (!ctx || muted) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol, ctx.currentTime + start);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
            osc.connect(gain).connect(ctx.destination);
            osc.start(ctx.currentTime + start);
            osc.stop(ctx.currentTime + start + dur);
        }
        function playChime() {
            [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.11, 0.35, 'triangle', 0.05));
        }
        function playClick() { tone(1200, 0, 0.03, 'square', 0.03); }
        function playDing() { tone(880, 0, 0.12, 'sine', 0.05); tone(1320, 0.06, 0.15, 'sine', 0.04); }

        function renderMuteIcon() {
            const el = document.getElementById('muteBtn');
            el.innerHTML = muted
                ? `<svg viewBox="0 0 16 16"><path d="M2 6h3l4-4v12l-4-4H2z" fill="#000"/><line x1="10" y1="5" x2="15" y2="11" stroke="#c00" stroke-width="2"/><line x1="15" y1="5" x2="10" y2="11" stroke="#c00" stroke-width="2"/></svg>`
                : `<svg viewBox="0 0 16 16"><path d="M2 6h3l4-4v12l-4-4H2z" fill="#000"/><path d="M11 4c2 2 2 6 0 8" fill="none" stroke="#000" stroke-width="1.4"/><path d="M13 2c3 3 3 9 0 12" fill="none" stroke="#000" stroke-width="1.4"/></svg>`;
        }
        renderMuteIcon();
        document.getElementById('muteBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            muted = !muted;
            renderMuteIcon();
        });

        let li = 0;
        function typeLine() {
            if (li >= biosLines.length) return;
            const p = document.createElement('div');
            biosEl.appendChild(p);
            let ci = 0, line = biosLines[li];
            const iv = setInterval(() => {

                    li++;
                    setTimeout(typeLine, 90);

                body: `
      <div class="paint-wrap">

        };

        /* Swap in hand-built pixel-art icons for desktop, start menu, and window chrome */
        Object.keys(PIXEL_ICONS).forEach(key => {
            if (winData[key]) winData[key].icon = PIXEL_ICONS[key];
        });
        document.querySelectorAll('[data-win]').forEach(el => {
            const key = el.dataset.win;
            if (!PIXEL_ICONS[key]) return;
            const svg = el.querySelector('svg');
            if (svg) svg.outerHTML = PIXEL_ICONS[key];
        });

        /* ===================== MINESWEEPER ===================== */
        const MS_SIZE = 9, MS_MINES = 10;
        let ms = null;

        function initMinesweeper() {
            ms = {
                cells: [],
                started: false,
                over: false,
                flags: 0,
                timer: 0,
                timerHandle: null,
            };
            for (let i = 0; i < MS_SIZE * MS_SIZE; i++) {
                ms.cells.push({ mine: false, revealed: false, flagged: false, n: 0 });
            }
            let placed = 0;
            while (placed < MS_MINES) {
                const idx = Math.floor(Math.random() * ms.cells.length);
                if (!ms.cells[idx].mine) { ms.cells[idx].mine = true; placed++; }
            }
            const neighbors = (idx) => {
                const x = idx % MS_SIZE, y = Math.floor(idx / MS_SIZE);
                const out = [];
                for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < MS_SIZE && ny >= 0 && ny < MS_SIZE) out.push(ny * MS_SIZE + nx);
                }
                return out;
            };
            ms.neighbors = neighbors;
            ms.cells.forEach((c, idx) => {
                if (c.mine) return;
                c.n = neighbors(idx).filter(ni => ms.cells[ni].mine).length;
            });
            updateMSFace('neutral');
            document.getElementById('msTimer').textContent = '000';
            updateMineCounter();
            renderMinesweeper();
        }

        function updateMineCounter() {
            const left = Math.max(0, MS_MINES - ms.flags);
            document.getElementById('msMineCount').textContent = String(left).padStart(3, '0');
        }

        function renderMinesweeper() {
            const grid = document.getElementById('msGrid');
            if (!grid) return;
            grid.innerHTML = '';
            ms.cells.forEach((c, idx) => {
                const cell = document.createElement('div');
                cell.className = 'ms-cell' + (c.revealed ? ' revealed' : '');
                if (c.revealed && c.mine) cell.classList.add('mine-hit');
                if (c.revealed && !c.mine && c.n > 0) { cell.dataset.n = c.n; cell.textContent = c.n; }
                if (c.revealed && c.mine) cell.innerHTML = '<svg viewBox="0 0 16 16" style="width:100%;height:100%"><circle cx="8" cy="8" r="5" fill="#000"/><rect x="6" y="2" width="4" height="6" fill="#000"/></svg>';
                if (!c.revealed && c.flagged) cell.innerHTML = '<svg viewBox="0 0 16 16" style="width:100%;height:100%"><rect x="6" y="2" width="2" height="12" fill="#c33dff"/><path d="M8 3 L14 5 L8 7 Z" fill="#ff3d3d"/></svg>';
                cell.addEventListener('click', () => msReveal(idx));
                cell.addEventListener('contextmenu', (e) => { e.preventDefault(); msFlag(idx); });
                grid.appendChild(cell);
            });
        }

        function msStartTimer() {
            if (ms.timerHandle) return;
            ms.timerHandle = setInterval(() => {
                ms.timer = Math.min(999, ms.timer + 1);
                document.getElementById('msTimer').textContent = String(ms.timer).padStart(3, '0');
            }, 1000);
        }
        function msStopTimer() { clearInterval(ms.timerHandle); ms.timerHandle = null; }

        function msFlag(idx) {
            if (ms.over || ms.cells[idx].revealed) return;
            const c = ms.cells[idx];
            c.flagged = !c.flagged;
            ms.flags += c.flagged ? 1 : -1;
            updateMineCounter();
            renderMinesweeper();
            playClick();
        }

        function msReveal(idx) {
            if (ms.over) return;
            const c = ms.cells[idx];
            if (c.flagged || c.revealed) return;
            if (!ms.started) { ms.started = true; msStartTimer(); }
            playClick();
            if (c.mine) {
                c.revealed = true;
                ms.over = true;
                msStopTimer();
                ms.cells.forEach(cc => { if (cc.mine) cc.revealed = true; });
                updateMSFace('dead');
                playDing();
                renderMinesweeper();
                return;
            }
            const stack = [idx];
            while (stack.length) {
                const i = stack.pop();
                const cc = ms.cells[i];
                if (cc.revealed || cc.flagged) continue;
                cc.revealed = true;
                if (cc.n === 0) ms.neighbors(i).forEach(ni => { if (!ms.cells[ni].revealed) stack.push(ni); });
            }
            const won = ms.cells.every(cc => cc.mine || cc.revealed);
            if (won) {
                ms.over = true; msStopTimer();
                ms.cells.forEach(cc => { if (cc.mine) cc.flagged = true; });
                ms.flags = MS_MINES;
                updateMineCounter();
                updateMSFace('cool');
                playChime();
            }
            renderMinesweeper();
        }

        document.addEventListener('click', (e) => {
            const msFace = document.getElementById('msFace');
            if ((e.target && e.target.id === 'msFace') || (msFace && msFace.contains(e.target))) {
                initMinesweeper();
            }
        });

        /* ===================== MINESWEEPER FACE PIXEL ART ===================== */
        function updateMSFace(state) {
            const face = document.getElementById('msFace');
            if (!face) return;
            const faces = {
                'neutral': '<svg viewBox="0 0 16 16" style="width:100%;height:100%"><circle cx="4" cy="5" r="1" fill="#000"/><circle cx="12" cy="5" r="1" fill="#000"/><path d="M5 9 Q8 10 11 9" stroke="#000" stroke-width="1" fill="none" stroke-linecap="round"/></svg>',
                'dead': '<svg viewBox="0 0 16 16" style="width:100%;height:100%"><line x1="3" y1="4" x2="5" y2="6" stroke="#000" stroke-width="1"/><line x1="5" y1="4" x2="3" y2="6" stroke="#000" stroke-width="1"/><line x1="11" y1="4" x2="13" y2="6" stroke="#000" stroke-width="1"/><line x1="13" y1="4" x2="11" y2="6" stroke="#000" stroke-width="1"/><path d="M6 10 Q8 8 10 10" stroke="#000" stroke-width="1" fill="none" stroke-linecap="round"/></svg>',
                'cool': '<svg viewBox="0 0 16 16" style="width:100%;height:100%"><rect x="2" y="4" width="3" height="2" fill="#000"/><rect x="11" y="4" width="3" height="2" fill="#000"/><path d="M5 9 Q8 10 11 9" stroke="#000" stroke-width="1" fill="none" stroke-linecap="round"/></svg>'
            };
            face.innerHTML = faces[state] || faces['neutral'];
        }

        /* ===================== PAINT ===================== */
        const PAINT_COLORS = [
            '#000000', '#7F7F7F', '#880015', '#ED1C24', '#FF7F27', '#FFF200', '#22B14C', '#00A2E8', '#3F48CC', '#A349A4',
            '#FFFFFF', '#C3C3C3', '#B97A57', '#FFAEC9', '#FFC90E', '#EFE4B0', '#99D9EA', '#7092BE', '#C8BFE7', '#B5E61D'
        ];
        let paintState = { color: '#000000', tool: 'pencil', drawing: false, cell: 10, cols: 32, rows: 32, ctx: null };

        function initPaint() {
            const canvas = document.getElementById('paintCanvas');
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            paintState.ctx = ctx;
            paintState.color = '#000000';
            paintState.tool = 'pencil';

            const palette = document.getElementById('paintPalette');
            palette.innerHTML = '';
            PAINT_COLORS.forEach((c, i) => {
                const sw = document.createElement('div');
                sw.className = 'paint-swatch' + (i === 0 ? ' selected' : '');
                sw.style.background = c;
                sw.addEventListener('click', () => {
                    paintState.color = c;
                    paintState.tool = 'pencil';
                    document.querySelectorAll('.paint-swatch').forEach(s => s.classList.remove('selected'));
                    sw.classList.add('selected');
                    document.querySelectorAll('.pt-btn[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === 'pencil'));
                });
                palette.appendChild(sw);
            });

            document.querySelectorAll('.pt-btn').forEach(btn => {
                btn.onclick = () => {
                    playClick();
                    if (btn.dataset.tool) {
                        paintState.tool = btn.dataset.tool;
                        document.querySelectorAll('.pt-btn[data-tool]').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    }
                    if (btn.dataset.action === 'clear') {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                    if (btn.dataset.action === 'save') {
                        const link = document.createElement('a');
                        link.download = 'my-pixel-art.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    }
                };
            });

            function paintAt(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
                const x = Math.floor((e.clientX - rect.left) * scaleX / paintState.cell);
                const y = Math.floor((e.clientY - rect.top) * scaleY / paintState.cell);
                if (x < 0 || y < 0 || x >= paintState.cols || y >= paintState.rows) return;
                ctx.fillStyle = paintState.tool === 'eraser' ? '#ffffff' : paintState.color;
                ctx.fillRect(x * paintState.cell, y * paintState.cell, paintState.cell, paintState.cell);
            }
            canvas.onmousedown = (e) => { paintState.drawing = true; paintAt(e); };
            canvas.onmousemove = (e) => { if (paintState.drawing) paintAt(e); };
            window.addEventListener('mouseup', () => paintState.drawing = false);
        }

        /* ===================== WINDOW MANAGER ===================== */
        let zTop = 100;
        const openWins = {};
        let cascadeOffset = 0;

        function openWindow(key) {
            playClick();
            document.body.classList.add('wait-cursor');
            setTimeout(() => document.body.classList.remove('wait-cursor'), 280);
            if (key === 'bin') playDing();
            if (openWins[key]) {
                focusWindow(key);
                if (openWins[key].el.style.display === 'none') openWins[key].el.style.display = 'flex';
                return;
            }
            const data = winData[key];
            const el = document.createElement('div');
            el.className = 'win';
            
            // Responsive window sizing
            let winW = data.w;
            let winH = data.h;
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            
            if (vw <= 480) {
                winW = Math.max(150, Math.min(data.w, vw - 20));
                winH = Math.max(120, Math.min(data.h, vh - 70));
            } else if (vw <= 768) {
                winW = Math.max(200, Math.min(data.w, vw - 40));
                winH = Math.max(150, Math.min(data.h, vh - 70));
            } else if (vw <= 1024) {
                winW = Math.max(250, Math.min(data.w, vw - 60));
                winH = Math.max(200, Math.min(data.h, vh - 100));
            }
            
            el.style.width = winW + 'px';
            el.style.height = winH + 'px';
            const centerX = Math.max(5, Math.min(vw - winW - 5, (vw - winW) / 2));
            const centerY = Math.max(5, Math.min(vh - winH - 40, (vh - winH - 40) / 2));
            el.style.left = centerX + 'px';
            el.style.top = centerY + 'px';
            el.style.zIndex = ++zTop;

            el.innerHTML = `
    <div class="titlebar">
      <div class="tleft">
        <div class="ticon">${data.icon}</div>
        <span class="ttext">${data.title}</span>
      </div>
      <div class="tbtns">
        <div class="tbtn" data-act="min">_</div>
        <div class="tbtn" data-act="max">▢</div>
        <div class="tbtn" data-act="close">×</div>
      </div>
    </div>
    ${data.menubar ? `<div class="menubar"><span>File</span><span>Edit</span><span>View</span><span>Help</span></div>` : ``}
    <div class="win-body ${data.explorer ? 'explorer' : ''}">${data.body}</div>
    <div class="win-statusbar"><div class="cell">${data.explorer ? '6 object(s)' : 'Ready'}</div></div>
  `;
            document.getElementById('root').appendChild(el);
            openWins[key] = { el };

            el.addEventListener('mousedown', () => focusWindow(key));
            el.querySelector('[data-act="close"]').addEventListener('click', (e) => {
                e.stopPropagation();
                el.remove(); delete openWins[key]; renderTaskbar();
            });
            el.querySelector('[data-act="min"]').addEventListener('click', (e) => {
                e.stopPropagation();
                el.style.display = 'none'; renderTaskbar();
            });
            el.querySelector('[data-act="max"]').addEventListener('click', (e) => {
                e.stopPropagation();
                if (el.dataset.maxed === '1') {
                    el.style.width = data.w + 'px'; el.style.height = data.h + 'px';
                    el.style.left = el.dataset.prevLeft; el.style.top = el.dataset.prevTop;
                    el.dataset.maxed = '0';
                } else {
                    el.dataset.prevLeft = el.style.left; el.dataset.prevTop = el.style.top;
                    el.style.left = '4px'; el.style.top = '4px';
                    el.style.width = 'calc(100vw - 12px)'; el.style.height = 'calc(100vh - 44px)';
                    el.dataset.maxed = '1';
                }
            });

            makeDraggable(el, el.querySelector('.titlebar'));
            if (key === 'minesweeper') initMinesweeper();
            if (key === 'paint') initPaint();
            focusWindow(key);
            renderTaskbar();
        }

        function focusWindow(key) {
            Object.entries(openWins).forEach(([k, w]) => {
                w.el.classList.toggle('inactive', k !== key);
            });
            openWins[key].el.style.zIndex = ++zTop;
            renderTaskbar(key);
        }

        function makeDraggable(win, handle) {
            let sx, sy, ox, oy, dragging = false;
            handle.addEventListener('mousedown', (e) => {
                if (e.target.closest('.tbtn')) return;
                dragging = true;
                sx = e.clientX; sy = e.clientY;
                ox = win.offsetLeft; oy = win.offsetTop;
                e.preventDefault();
            });
            window.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                win.style.left = Math.max(0, ox + (e.clientX - sx)) + 'px';
                win.style.top = Math.max(0, oy + (e.clientY - sy)) + 'px';
            });
            window.addEventListener('mouseup', () => dragging = false);
        }

        function renderTaskbar(activeKey) {
            const bar = document.getElementById('taskApps');
            bar.innerHTML = '';
            Object.entries(openWins).forEach(([k, w]) => {
                const btn = document.createElement('div');
                btn.className = 'task-btn' + (k === activeKey && w.el.style.display !== 'none' ? ' active' : '');
                btn.innerHTML = `${winData[k].icon}<span>${winData[k].title.split(' - ')[0]}</span>`;
                btn.addEventListener('click', () => {
                    if (w.el.style.display === 'none') { w.el.style.display = 'flex'; focusWindow(k); }
                    else if (k === activeKey) { w.el.style.display = 'none'; renderTaskbar(); }
                    else { focusWindow(k); }
                });
                bar.appendChild(btn);
            });
        }

        /* ===================== ICON / DESKTOP INTERACTION ===================== */
        let lastClickTime = {};
        document.querySelectorAll('.icon').forEach(icon => {
            icon.addEventListener('click', (e) => {
                const iconId = icon.dataset.win;
                const now = Date.now();
                
                // Check for double-click
                if (lastClickTime[iconId] && now - lastClickTime[iconId] < 300) {
                    openWindow(iconId);
                    lastClickTime[iconId] = 0;
                    return;
                }
                
                lastClickTime[iconId] = now;
                document.querySelectorAll('.icon').forEach(i => i.classList.remove('selected'));
                icon.classList.add('selected');
            });
            icon.addEventListener('dblclick', () => openWindow(icon.dataset.win));
            icon.addEventListener('keydown', (e) => { if (e.key === 'Enter') openWindow(icon.dataset.win); });
        });
        document.getElementById('desktop').addEventListener('click', (e) => {
            if (e.target.id === 'desktop') document.querySelectorAll('.icon').forEach(i => i.classList.remove('selected'));
        });

        /* ===================== CONTEXT MENUS ===================== */
        function closeCtxMenu() {
            const existing = document.getElementById('ctxMenu');
            if (existing) existing.remove();
        }
        function showCtxMenu(x, y, items) {
            closeCtxMenu();
            const menu = document.createElement('div');
            menu.id = 'ctxMenu';
            menu.className = 'ctx-menu';
            items.forEach(it => {
                if (it.sep) { const s = document.createElement('div'); s.className = 'ctx-sep'; menu.appendChild(s); return; }
                const row = document.createElement('div');
                row.className = 'ctx-item' + (it.disabled ? ' disabled' : '');
                row.textContent = it.label;
                if (!it.disabled) row.addEventListener('click', () => { playClick(); it.action && it.action(); closeCtxMenu(); });
                menu.appendChild(row);
            });
            document.body.appendChild(menu);
            const mw = menu.offsetWidth, mh = menu.offsetHeight;
            menu.style.left = Math.min(x, window.innerWidth - mw - 6) + 'px';
            menu.style.top = Math.min(y, window.innerHeight - mh - 40) + 'px';
        }
        document.addEventListener('click', closeCtxMenu);
        document.addEventListener('contextmenu', (e) => {
            if (!e.target.closest('.icon') && !e.target.closest('#desktop')) closeCtxMenu();
        });

        document.querySelectorAll('.icon').forEach(icon => {
            icon.addEventListener('contextmenu', (e) => {
                e.preventDefault(); e.stopPropagation();
                document.querySelectorAll('.icon').forEach(i => i.classList.remove('selected'));
                icon.classList.add('selected');
                const key = icon.dataset.win;
                const name = icon.querySelector('span').textContent;
                showCtxMenu(e.clientX, e.clientY, [
                    { label: 'Open', action: () => openWindow(key) },
                    { sep: true },
                    { label: 'Delete', action: () => alert(`"${name}" is a protected system file and can't be deleted.`) },
                    { label: 'Rename', disabled: true },
                    { sep: true },
                    { label: 'Properties', action: () => alert(`${name}\nType: Portfolio Item\nLocation: Desktop\n\nDouble-click to open.`) },
                ]);
            });
        });

        document.getElementById('desktop').addEventListener('contextmenu', (e) => {
            if (e.target.id !== 'desktop') return;
            e.preventDefault();
            showCtxMenu(e.clientX, e.clientY, [
                { label: 'Arrange Icons', disabled: true },
                { label: 'Refresh', action: () => location.reload() },
                { sep: true },
                { label: 'Properties', action: () => openWindow('about') },
            ]);
        });

        /* ===================== START MENU ===================== */
        const startMenu = document.getElementById('startMenu');
        const startBtn = document.getElementById('startBtn');
        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            playClick();
            startMenu.classList.toggle('open');
            startBtn.classList.toggle('active');
        });
        document.addEventListener('click', (e) => {
            if (!startMenu.contains(e.target) && e.target !== startBtn) {
                startMenu.classList.remove('open');
                startBtn.classList.remove('active');
            }
        });
        document.querySelectorAll('.sm-item[data-win]').forEach(item => {
            item.addEventListener('click', () => {
                openWindow(item.dataset.win);
                startMenu.classList.remove('open');
                startBtn.classList.remove('active');
            });
        });
        document.getElementById('shutdownBtn').addEventListener('click', () => {
            document.getElementById('root').innerHTML = `
    <div style="position:fixed; inset:0; background:#000; color:#fff; font-family:'VT323',monospace;
      font-size:24px; display:flex; align-items:center; justify-content:center; text-align:center;">
      It's now safe to close this tab.<br><br>(Thanks for stopping by!)
    </div>`;
        });
